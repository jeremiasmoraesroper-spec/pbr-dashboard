name: Atualizar dashboard (diario)

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Coletar dados da Supermetrics
        env:
          SUPERMETRICS_API_KEY: ${{ secrets.SUPERMETRICS_API_KEY }}
          SUPERMETRICS_ACCOUNT_ID: ${{ secrets.SUPERMETRICS_ACCOUNT_ID }}
          SUPERMETRICS_DS_ID: ${{ secrets.SUPERMETRICS_DS_ID }}
        run: npm run collect
      - name: Build estatico
        run: npm run build
      - name: Preparar artefato
        run: touch out/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
